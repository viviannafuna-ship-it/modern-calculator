<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
    <style> 

    </style>
</head>
<body>
    <div>
  <div class="calculator">
    <input type="text" placeholder="0">     
        <div>
            <button class="tip">AC</button>
            <button>00</button>
            <button>%</button>
            <button class="red">&div;</button>
        </div>
 <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="red">&times;</button>
        </div>
 <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="red">-</button>
        </div>
 <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="red">+</button>
        </div>
<div>
            <button class="keep">0</button>
            <button>.</button>
            <button class="red">=</button>
            
        </div>


    </div>



    
</body>
</html>
